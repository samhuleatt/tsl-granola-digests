name: TSL Weekly Digest

on:
  schedule:
    # 9am Eastern on Saturday. GitHub cron is UTC, so run both DST offsets;
    # src/weekly.js sends from 9am ET Saturday on, once per Saturday.
    - cron: '17 13,14 * * 6'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the email instead of a dry run'
        required: false
        default: false
        type: boolean

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - run: node src/weekly.js
        env:
          DIGEST_PREVIEW_PATH: weekly-preview.html
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REQUIRE_DIGEST_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          SEND_DIGEST_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
      - name: Save manual dry-run preview
        if: github.event_name == 'workflow_dispatch' && !inputs.send_email
        uses: actions/upload-artifact@v4
        with:
          name: weekly-preview
          path: weekly-preview.html
          if-no-files-found: ignore
          retention-days: 3
