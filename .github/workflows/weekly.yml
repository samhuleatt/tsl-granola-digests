name: TSL Weekly Operating Review

on:
  schedule:
    # 7am Eastern on Monday. GitHub cron is UTC, so run both DST offsets;
    # src/weekly.js sends only when the Eastern weekday/hour matches.
    - cron: '0 11,12 * * 1'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the email instead of a dry run'
        required: false
        default: false
        type: boolean

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: node src/weekly.js
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRM_SPREADSHEET_ID: 1blCZAQgG1Q3FbrAh1-XH9tKTQHEmFmHLkJBU56hHUXs
          CRM_PIPELINE_RANGE: "'CRM Pipeline'!A:P"
          WEEKLY_AGENT_MEMORY_URL: https://mdcwlnoyndknefokaumy.supabase.co/functions/v1/weekly-agent-memory
          WEEKLY_AGENT_SECRET: ${{ secrets.WEEKLY_AGENT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REQUIRE_DIGEST_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          SEND_DIGEST_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
