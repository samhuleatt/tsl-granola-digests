name: TSL Daily Digest

on:
  schedule:
    # 9pm Eastern, Monday-Friday. GitHub cron is UTC, so run both DST offsets.
    # GitHub often starts these hours late; src/daily.js counts any run before
    # noon ET for the evening before and sends once per digest day.
    - cron: '17 1,2 * * 2-6'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the email instead of a dry run'
        required: false
        default: false
        type: boolean

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - run: npm test
      - run: node src/daily.js
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REQUIRE_DIGEST_WINDOW: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          SEND_DIGEST_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
